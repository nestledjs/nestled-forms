name: CI

on:
  push:
    branches:
      - develop
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: "--max-old-space-size=4096"
      NX_CLOUD_AUTH_TOKEN: ${{ secrets.NX_CLOUD_AUTH_TOKEN }}
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Cache Playwright Browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-browsers
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install dependencies (triggers postinstall + playwright install)
        run: pnpm install --frozen-lockfile

      - name: Verify browser installation
        run: |
          if [ ! -f ~/.cache/ms-playwright/chromium-*/*/chrome-linux/headless_shell ]; then
            echo "Browser install incomplete. Reinstalling..."
            pnpm exec playwright install --with-deps
          fi

      # Enable Nx Cloud Distributed CI (keep this)
      - run: pnpm dlx nx-cloud start-ci-run --distribute-on="3 linux-medium-js" --stop-agents-after="build"

      - uses: nrwl/nx-set-shas@v4

      # `build` is deliberately not in this step. The publish gate below needs
      # every package's dist, so build runs as `run-many --all` instead. Doing
      # both left the run-many with nothing new to distribute, and Nx Cloud
      # fails a distributed execution that detects no additional tasks.
      - name: Run affected commands
        run: pnpm exec nx affected -t lint test

      # Supplies dist/ for the publish gate, and is the only build invocation,
      # so it owns the tasks the agents distribute. --stop-agents-after="build"
      # then tears them down at the right point.
      - name: Build all packages
        run: pnpm exec nx run-many -t build --all

      # Catches declaration bugs that are invisible in-workspace: emitted paths
      # resolve here but not once installed. Exactly how the 0.8.1 type break
      # passed lint, test and build and still shipped broken to npm.
      - name: Verify published package types
        run: pnpm verify-types
