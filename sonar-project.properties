# SonarQube/SonarCloud configuration for Nx monorepo

# TypeScript configuration - explicit paths for monorepo packages
sonar.typescript.tsconfigPaths=forms/tsconfig.json,forms-native/tsconfig.json,forms-core/tsconfig.json

# Source directories
sonar.sources=forms/src,forms-native/src,forms-core/src

# Exclude test/story files from analysis (they are documentation/test code)
sonar.exclusions=**/*.stories.tsx,**/*.stories.ts,**/*.spec.ts,**/*.spec.tsx,**/*.test.ts,**/*.test.tsx,**/dist/**,**/node_modules/**

# Test file patterns (for coverage reporting, not quality analysis)
sonar.tests=forms/src,forms-native/src,forms-core/src
sonar.test.inclusions=**/*.stories.tsx,**/*.stories.ts,**/*.spec.ts,**/*.spec.tsx,**/*.test.ts,**/*.test.tsx
